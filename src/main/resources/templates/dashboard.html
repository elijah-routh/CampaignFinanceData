<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title th:text="${candidate.name}">Candidate Dashboard</title>
</head>

<body>

<div layout:fragment="content">

    <!-- Candidate Header -->
    <div class="mb-4">

        <h1 th:text="${candidate.name}">
            Candidate Name
        </h1>

        <p class="text-muted mb-0">
            <span th:text="${candidate.party}">Party</span>
            ·
            <span th:text="${candidate.office}">Office</span>
            ·
            <span th:text="${candidate.state}">State</span>
        </p>

        <small class="text-muted"
               th:text="'FEC ID: ' + ${candidate.candidateId}">
            FEC ID
        </small>

    </div>


    <!-- Financial Summary -->
    <div class="row g-3 mb-5">

        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-body">

                    <h6 class="card-subtitle text-muted">
                        Total Raised
                    </h6>

                    <!-- <h3 class="card-title mt-2"
                        th:text="${financeSummary.totalRaised}">
                        $0
                    </h3> -->

                </div>
            </div>
        </div>


        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-body">

                    <h6 class="card-subtitle text-muted">
                        Total Spent
                    </h6>

                    <!-- <h3 class="card-title mt-2"
                        th:text="${financeSummary.totalSpent}">
                        $0
                    </h3> -->

                </div>
            </div>
        </div>


        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-body">

                    <h6 class="card-subtitle text-muted">
                        Cash on Hand
                    </h6>

                    <!-- <h3 class="card-title mt-2"
                        th:text="${financeSummary.cashOnHand}">
                        $0
                    </h3> -->

                </div>
            </div>
        </div>


        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-body">

                    <h6 class="card-subtitle text-muted">
                        Debt
                    </h6>

                    <!-- <h3 class="card-title mt-2"
                        th:text="${financeSummary.debt}">
                        $0
                    </h3> -->

                </div>
            </div>
        </div>

    </div>


    <!-- Incoming Finance -->
    <section class="mb-5">

        <div class="d-flex justify-content-between align-items-center mb-3">

            <h2 class="h4 mb-0">
                Incoming Finance
            </h2>

            <span class="text-muted">
                Contributions received
            </span>

        </div>


        <div class="table-responsive">

            <table class="table table-striped table-hover align-middle">

                <thead>
                <tr>
                    <th>Contributor</th>
                    <th>Type</th>
                    <th>Date</th>
                    <th class="text-end">Amount</th>
                </tr>
                </thead>

                <tbody>

                <!-- <tr th:each="transaction : ${incomingTransactions}">

                    <td th:text="${transaction.name}">
                        Contributor
                    </td>

                    <td th:text="${transaction.type}">
                        Individual
                    </td>

                    <td th:text="${transaction.date}">
                        Date
                    </td>

                    <td class="text-end fw-semibold"
                        th:text="${transaction.amount}">
                        $0
                    </td>

                </tr> -->

                </tbody>

            </table>

        </div>

    </section>


    <!-- Outgoing Finance -->
    <section class="mb-5">

        <div class="d-flex justify-content-between align-items-center mb-3">

            <h2 class="h4 mb-0">
                Outgoing Finance
            </h2>

            <span class="text-muted">
                Campaign spending
            </span>

        </div>


        <div class="table-responsive">

            <table class="table table-striped table-hover align-middle">

                <thead>
                <tr>
                    <th>Recipient</th>
                    <th>Purpose</th>
                    <th>Date</th>
                    <th class="text-end">Amount</th>
                </tr>
                </thead>

                <tbody>

                <!-- <tr th:each="transaction : ${outgoingTransactions}">

                    <td th:text="${transaction.name}">
                        Recipient
                    </td>

                    <td th:text="${transaction.purpose}">
                        Expense
                    </td>

                    <td th:text="${transaction.date}">
                        Date
                    </td>

                    <td class="text-end fw-semibold"
                        th:text="${transaction.amount}">
                        $0
                    </td>

                </tr> -->

                </tbody>

            </table>

        </div>

    </section>


    <div class="row g-4">

        <!-- PACs / Committees -->
        <div class="col-lg-6">

            <section>

                <h2 class="h4 mb-3">
                    Related PACs & Committees
                </h2>


                <div class="list-group">

                    <!-- <a th:each="committee : ${relatedCommittees}"
                       th:href="@{/committees/{id}(id=${committee.committeeId})}"
                       class="list-group-item list-group-item-action">

                        <div class="d-flex justify-content-between">

                            <strong th:text="${committee.name}">
                                Committee
                            </strong>

                            <span th:text="${committee.amount}">
                                $0
                            </span>

                        </div>

                        <small class="text-muted"
                               th:text="${committee.type}">
                            Committee Type
                        </small>

                    </a> -->

                </div>

            </section>

        </div>


        <!-- Donors -->
        <div class="col-lg-6">

            <section>

                <h2 class="h4 mb-3">
                    Top Donors
                </h2>


                <div class="list-group">

                    <!-- <div th:each="donor : ${donors}"
                         class="list-group-item">

                        <div class="d-flex justify-content-between">

                            <strong th:text="${donor.name}">
                                Donor Name
                            </strong>

                            <span class="fw-semibold"
                                  th:text="${donor.amount}">
                                $0
                            </span>

                        </div>

                        <small class="text-muted">

                            <span th:text="${donor.occupation}">
                                Occupation
                            </span>

                            <span th:if="${donor.employer != null}">
                                ·
                                <span th:text="${donor.employer}">
                                    Employer
                                </span>
                            </span>

                        </small>

                    </div> -->

                </div>

            </section>

        </div>

    </div>

</div>

</body>
</html>
